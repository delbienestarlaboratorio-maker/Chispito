name: Deploy Next.js to Cloudflare Pages (OpenNext)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js with OpenNext
        run: npm run pages:build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_PLAN_V2_PRECIO: 9900
          NEXT_PUBLIC_PLAN_V3_PRECIO: 24900
          NEXT_PUBLIC_SITE_URL: "https://chispito.mx"

      - name: Diagnostic - Locate Telesecundaria Files
        run: |
          echo "==== Searching .next for telesecundaria HTML ===="
          find .next -name "telesecundaria-1*" -type f 2>/dev/null || echo "  (no .next files found)"
          echo ""
          echo "==== Searching .open-next for telesecundaria ===="
          find .open-next -name "*telesecundaria-1*" -type f 2>/dev/null | head -10 || echo "  (no .open-next files found)"
          echo ""
          echo "==== .next/server/app dir listing (if exists) ===="
          ls -la .next/server/app/telesecundaria-1* 2>/dev/null || echo "  (.next/server/app has no telesecundaria files)"
          echo ""
          echo "==== .next/server/app/ HTML files ===="
          find .next/server/app -name "*.html" -type f 2>/dev/null | head -20 || echo "  (no HTML files)"

      - name: Assemble Edge Worker
        run: |
          cp .open-next/worker.js .open-next/assets/_worker.js
          cp -r .open-next/cloudflare .open-next/assets/cloudflare
          cp -r .open-next/middleware .open-next/assets/middleware
          cp -r .open-next/server-functions .open-next/assets/server-functions
          cp -r .open-next/.build .open-next/assets/.build
          cp -r .open-next/cache .open-next/assets/cache || true
          cp -r public/* .open-next/assets/ || true
          echo -e "cloudflare\nmiddleware\nserver-functions\n.build\ncache" > .open-next/assets/.cfignore

      - name: Inject Static Telesecundaria Pages
        run: |
          echo "=== Injecting pre-rendered telesecundaria HTML as static assets ==="
          INJECTED=0
          for grade in telesecundaria-1 telesecundaria-2 telesecundaria-3; do
            # Try .next/server/app/ first (standard Next.js output)
            HTML_FILE=".next/server/app/${grade}.html"
            if [ ! -f "$HTML_FILE" ]; then
              # Fallback: search anywhere in .next for the HTML
              HTML_FILE=$(find .next -name "${grade}.html" -type f 2>/dev/null | head -1)
            fi
            if [ -n "$HTML_FILE" ] && [ -f "$HTML_FILE" ]; then
              mkdir -p ".open-next/assets/${grade}"
              cp "$HTML_FILE" ".open-next/assets/${grade}/index.html"
              echo "  ✓ ${grade}/index.html injected from ${HTML_FILE} ($(wc -c < $HTML_FILE) bytes)"
              INJECTED=$((INJECTED+1))
            else
              echo "  ⚠ ${grade}.html NOT FOUND anywhere in .next"
            fi
          done
          echo "=== Injected ${INJECTED}/3 telesecundaria pages ==="

      - name: Generate Static Sitemap
        run: |
          SITEMAP_OUTPUT=.open-next/assets node scripts/generate-sitemap.mjs
          ls -lh .open-next/assets/sitemap.xml
          head -3 .open-next/assets/sitemap.xml
          echo "URL count: $(grep -c '<url>' .open-next/assets/sitemap.xml)"

      - name: Diagnostic - Bundle Sizes
        run: |
          echo "==== SERVER HANDLER ===="
          ls -lh .open-next/assets/server-functions/default/handler.mjs
          echo "==== MIDDLEWARE HANDLER ===="
          ls -lh .open-next/assets/middleware/handler.mjs
          echo "==== TOTAL ASSET FILES ===="
          find .open-next/assets -type f | wc -l
          echo "==== FILES > 500K ===="
          find .open-next/assets -type f -size +500k -exec ls -lh {} \;
          echo "==== STATIC FILES (sitemap, robots, ads) ===="
          ls -lh .open-next/assets/sitemap.xml 2>/dev/null || echo "⚠ sitemap.xml NOT FOUND in assets!"
          ls -lh .open-next/assets/robots.txt 2>/dev/null || echo "⚠ robots.txt NOT FOUND in assets!"
          ls -lh .open-next/assets/ads.txt 2>/dev/null || echo "⚠ ads.txt NOT FOUND in assets!"
          echo "==== HEAD OF SITEMAP ===="
          head -5 .open-next/assets/sitemap.xml 2>/dev/null || echo "No sitemap found"
          echo "==== SITEMAP URL COUNT ===="
          grep -c '<url>' .open-next/assets/sitemap.xml 2>/dev/null || echo "0"
          echo "==== TELESECUNDARIA STATIC FILES ===="
          find .open-next/assets -path "*telesecundaria*" -type f 2>/dev/null || echo "  (none)"

      - name: Generate _routes.json
        run: |
          cat << 'EOF' > .open-next/assets/_routes.json
          {
            "version": 1,
            "include": [
              "/*"
            ],
            "exclude": [
              "/_next/*",
              "/favicon.ico",
              "/icon.svg",
              "/robots.txt",
              "/ads.txt",
              "/personajes/*",
              "/img/*",
              "/materias/*",
              "/*.png",
              "/telesecundaria-1",
              "/telesecundaria-2",
              "/telesecundaria-3"
            ]
          }
          EOF
          echo "==== GENERATED _ROUTES.JSON ===="
          cat .open-next/assets/_routes.json

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy .open-next/assets --project-name chispito-mx --branch main 2>&1 || {
            echo "==== WRANGLER DEPLOY FAILED ===="
            echo "Exit code: $?"
            echo "Retrying with verbose logging..."
            WRANGLER_LOG=debug npx wrangler pages deploy .open-next/assets --project-name chispito-mx --branch main 2>&1 || true
          }

      - name: Deploy Sitemap Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --config workers/wrangler.toml 2>&1 || {
            echo "⚠ Sitemap Worker deploy failed (non-blocking)"
          }
