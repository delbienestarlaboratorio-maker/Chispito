# Cloudflare Pages configuration for Chispito.mx
name = "chispito-mx"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".open-next/assets"

[vars]
NEXT_PUBLIC_SITE_URL = "https://chispito.mx"

# KV namespace for OpenNext incremental cache (prerendered pages)
# The @opennextjs/cloudflare adapter strictly expects these exact binding names
[[kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "74f56981c4ca4513bb1d6eef54c2d5f6"

[[kv_namespaces]]
binding = "NEXT_TAG_CACHE_KV"
id = "74f56981c4ca4513bb1d6eef54c2d5f6"

