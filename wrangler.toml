# Cloudflare Pages configuration for Chispito.mx
name = "chispito-mx"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".open-next/assets"
minify = true

[vars]
NEXT_PUBLIC_SITE_URL = "https://chispito.mx"

# KV namespace for OpenNext incremental cache (prerendered pages)
# Without this binding, the worker can't serve prerendered pages like telesecundaria
[[kv_namespaces]]
binding = "NEXT_CACHE_WORKERS_KV"
id = "74f56981c4ca4513bb1d6eef54c2d5f6"
